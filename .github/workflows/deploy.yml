name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate static product cards and first-paint filters
        run: node tools/build-catalog-first-paint.cjs
      - name: Ensure GA4 tracking is present and permitted
        run: python3 tools/check_tracking.py --fix
      - name: Normalize shared assets and verify release references
        run: |
          node tools/sync-shared-assets.cjs --write
          node tools/sync-shared-assets.cjs --check
          node --test tools/shared-assets.test.cjs
      - name: Guard manual, accessible product galleries
        run: |
          node tools/migrate-product-galleries.cjs --check
          node --test tools/product-gallery.test.cjs
      - name: Guard bilingual product media and metadata
        run: |
          python3 tools/product_media.py
          python3 tools/product_media_test.py
      - name: Guard product inquiry state
        run: |
          node tools/migrate-product-inquiry.cjs --check
          node --test tools/product-inquiry.test.cjs
      - name: Guard approved product previews
        run: node --test tools/product-previews.test.cjs
      - name: Guard lazy product video startup and recovery
        run: node --test tools/product-video-start.test.cjs
      - name: Guard video overview recovery and footer copy
        run: node --test tools/video-wall.test.cjs tools/footer-wechat.test.cjs tools/video-wall-playback.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
