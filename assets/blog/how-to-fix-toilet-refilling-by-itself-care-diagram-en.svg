<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1200 675" role="img"><title>Stop unexplained tank refills</title><style>text{font-family:Inter,"Noto Sans TC","PingFang TC",Arial,sans-serif}</style><rect width="1200" height="675" fill="#fff"/><text x="58" y="52" font-size="15" fill="#2563a8" font-weight="500">CHENGDA  /  PRACTICAL CARE</text><text x="58" y="125" font-size="40" fill="#14171b" font-weight="600">Stop unexplained tank refills</text><path d="M58 176H1142" stroke="#e6e8ec"/><text x="58" y="297" font-size="76" fill="#2563a8" font-weight="500">01</text><text x="58" y="385" font-size="29" fill="#14171b" font-weight="600">Match</text><text x="58" y="439" font-size="22" fill="#51565e" font-weight="400">Identify the toilet and pattern.</text><text x="58" y="477" font-size="22" fill="#51565e" font-weight="400">Use the correct service guide.</text><path d="M408 216V547" stroke="#e6e8ec"/><text x="431" y="297" font-size="76" fill="#2563a8" font-weight="500">02</text><text x="431" y="385" font-size="29" fill="#14171b" font-weight="600">Repair</text><text x="431" y="439" font-size="22" fill="#51565e" font-weight="400">Restore the seal, inlet setting</text><text x="431" y="477" font-size="22" fill="#51565e" font-weight="400">or refill-hose connection.</text><path d="M781 216V547" stroke="#e6e8ec"/><text x="804" y="297" font-size="76" fill="#2563a8" font-weight="500">03</text><text x="804" y="385" font-size="29" fill="#14171b" font-weight="600">Verify</text><text x="804" y="439" font-size="22" fill="#51565e" font-weight="400">Let the tank refill and stop.</text><text x="804" y="477" font-size="22" fill="#51565e" font-weight="400">Repeat the leak check.</text><path d="M58 587H1142" stroke="#e6e8ec"/><text x="58" y="631" font-size="19" fill="#7a8088" font-weight="400">Follow the model-specific steps in the article.</text></svg>