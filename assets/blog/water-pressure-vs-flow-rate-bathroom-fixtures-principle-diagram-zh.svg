<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1200 675" role="img"><title>水壓與流量是兩回事</title><style>svg{--ink:#14171b;--accent:#2563a8;--paper:#fff;font-family:Inter,"Noto Sans TC","PingFang TC",Arial,sans-serif}text{letter-spacing:0}</style><rect width="1200" height="675" fill="#fff"/><text x="58" y="52" font-size="15" font-weight="500" fill="#2563a8" text-anchor="start">CHENGDA  /  BATHROOM SCIENCE</text><text x="58" y="120" font-size="43" font-weight="600" fill="var(--ink)" text-anchor="start">水壓與流量是兩回事</text><text x="58" y="161" font-size="22" font-weight="400" fill="#7a8088" text-anchor="start">三種讀數，回答三個不同問題。</text><path d="M58 191 H1142" stroke="#e6e8ec"/><text x="58" y="235" font-size="16" font-weight="500" fill="#2563a8" text-anchor="start">01</text><g transform="translate(115 268) scale(1.04)" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="89" cy="65" r="49" fill="var(--paper)"/><path d="M89 65 L112 36" stroke="var(--accent)"/><path d="M89 114 V144 M20 144 H167"/><path d="M148 132 L160 154 M160 132 L148 154" stroke="var(--accent)"/></g><text x="58" y="479" font-size="26" font-weight="600" fill="var(--ink)" text-anchor="start">靜壓</text><text x="58" y="519" font-size="23" font-weight="400" fill="#2c3138" text-anchor="start">沒有水流動時，</text><text x="58" y="551" font-size="23" font-weight="400" fill="#2c3138" text-anchor="start">測量位置的壓力。</text><path d="M408 220 V560" stroke="#e6e8ec"/><text x="431" y="235" font-size="16" font-weight="500" fill="#2563a8" text-anchor="start">02</text><g transform="translate(488 268) scale(1.04)" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="89" cy="65" r="49" fill="var(--paper)"/><path d="M89 65 L112 36" stroke="var(--accent)"/><path d="M89 114 V144 M20 144 H167"/><path d="M153 144 H179 M168 135 L180 144 L168 153" stroke="var(--accent)"/></g><text x="431" y="479" font-size="26" font-weight="600" fill="var(--ink)" text-anchor="start">運行壓力</text><text x="431" y="519" font-size="23" font-weight="400" fill="#2c3138" text-anchor="start">在指定用水條件下，</text><text x="431" y="551" font-size="23" font-weight="400" fill="#2c3138" text-anchor="start">測量位置的壓力。</text><path d="M781 220 V560" stroke="#e6e8ec"/><text x="804" y="235" font-size="16" font-weight="500" fill="#2563a8" text-anchor="start">03</text><g transform="translate(861 268) scale(1.04)" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M39 42 L50 147 H136 L147 42" fill="var(--paper)"/><path d="M47 105 H139" stroke="var(--accent)"/><path d="M90 10 V79 M81 70 L90 82 L99 70" stroke="var(--accent)"/><path d="M61 124 H77 M61 100 H77 M61 76 H77"/></g><text x="804" y="479" font-size="26" font-weight="600" fill="var(--ink)" text-anchor="start">流量</text><text x="804" y="519" font-size="23" font-weight="400" fill="#2c3138" text-anchor="start">每單位時間流出的水量。</text><text x="804" y="551" font-size="23" font-weight="400" fill="#2c3138" text-anchor="start">例：1 L／10 s＝6 L/min。</text><path d="M58 591 H1142" stroke="#e6e8ec"/><text x="58" y="634" font-size="19" font-weight="400" fill="#7a8088" text-anchor="start">數字僅為教學算例，並非產品門檻或實測結果。</text></svg>