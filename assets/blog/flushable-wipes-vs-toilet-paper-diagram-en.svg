<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1200 675" role="img" aria-labelledby="figure-title figure-desc" xml:lang="en"><title id="figure-title">Leaving the bowl is only the first stage</title><desc id="figure-desc">A toilet leads through a branch pipe to a wider wastewater network. Toilet paper is shown beside the bowl; a wipe is directed separately toward a bin, with wording to check local guidance. The diagram does not claim that every wipe or every jurisdiction follows identical rules. Clearing the bowl alone cannot demonstrate compatibility with the entire route.</desc><defs><marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#2563a8"/></marker><marker id="arrow-gray" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#7a8088"/></marker></defs><style>text{font-family:Inter,"PingFang TC",Arial,sans-serif;letter-spacing:0}svg{background:#fff}</style><rect width="1200" height="675" fill="#fff"/><text x="58" y="49" font-size="15" fill="#2563a8" font-weight="500" text-anchor="start">CHENGDA  /  BATHROOM SCIENCE</text><text x="58" y="111" font-size="36" fill="#14171b" font-weight="600" text-anchor="start">Leaving the bowl is only the first stage</text><text x="58" y="153" font-size="22" fill="#7a8088" font-weight="400" text-anchor="start">The route continues through branch pipes and the wider wastewater system.</text><path d="M58 184H1142" stroke="#e6e8ec" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="220" y="240" font-size="25" fill="#14171b" font-weight="600" text-anchor="middle">Toilet</text><text x="548" y="240" font-size="25" fill="#14171b" font-weight="600" text-anchor="middle">Branch pipe</text><text x="949" y="240" font-size="25" fill="#14171b" font-weight="600" text-anchor="middle">Wastewater system</text><rect x="114" y="278" width="85" height="94" rx="8" stroke="#14171b" stroke-width="4" fill="#fff" /><path d="M108 278H206" stroke="#14171b" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M153 370H321Q314 419 267 431L268 472H201L210 426Q174 417 153 370Z" stroke="#14171b" stroke-width="4" fill="#fff" stroke-linejoin="round" stroke-linecap="round" /><path d="M160 370Q235 388 317 370" stroke="#14171b" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M267 414H758" stroke="#14171b" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M267 434H758" stroke="#14171b" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M230 400C250 408 278 424 326 424H458" stroke="#2563a8" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/><path d="M500 424H697" stroke="#2563a8" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/><path d="M760 424H902V289H1048M901 424H1114M901 424V480H1083" stroke="#7a8088" stroke-width="8" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="901" cy="424" r="10" stroke="#14171b" stroke-width="3" fill="#fff" /><circle cx="1048" cy="289" r="9" stroke="#7a8088" stroke-width="2" fill="#fff" /><circle cx="1114" cy="424" r="9" stroke="#7a8088" stroke-width="2" fill="#fff" /><circle cx="1083" cy="480" r="9" stroke="#7a8088" stroke-width="2" fill="#fff" /><path d="M772 424H865" stroke="#2563a8" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/><text x="578" y="328" font-size="23" fill="#14171b" font-weight="400" text-anchor="middle">One flush does not test</text><text x="578" y="359" font-size="23" fill="#14171b" font-weight="400" text-anchor="middle">the whole route.</text><rect x="102" y="502" width="45" height="42" rx="5" stroke="#14171b" stroke-width="2.5" fill="#fff" /><circle cx="145" cy="513" r="10" stroke="#14171b" stroke-width="2.5" fill="#fff" /><path d="M145 523V550H172" stroke="#14171b" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="186" y="536" font-size="22" fill="#14171b" font-weight="400" text-anchor="start">Toilet paper</text><g transform="translate(601 526) scale(1)"><path d="M-25 -19Q-9 -11 7 -20L30 -8L20 19Q2 9 -23 22L-30 0Z" stroke="#14171b" stroke-width="2.5" fill="#fff" stroke-linejoin="round" stroke-linecap="round" /><path d="M-17 -7Q-4 0 9 -7M-8 6L11 4" stroke="#7a8088" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" /></g><text x="556" y="570" font-size="21" fill="#14171b" font-weight="400" text-anchor="start">Wipes</text><path d="M647 528H772" stroke="#2563a8" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/><rect x="811" y="505" width="55" height="56" rx="4" stroke="#14171b" stroke-width="3" fill="#fff" /><path d="M804 501H873M825 493H852M827 516V548M850 516V548" stroke="#14171b" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="895" y="521" font-size="22" fill="#14171b" font-weight="400" text-anchor="start">Bin? Follow your</text><text x="895" y="551" font-size="22" fill="#14171b" font-weight="400" text-anchor="start">local disposal guidance.</text><path d="M58 598H1142" stroke="#e6e8ec" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="58" y="639" font-size="20" fill="#7a8088" font-weight="400" text-anchor="start">Schematic only. Product claims, sewer guidance and septic-system guidance can differ.</text></svg>