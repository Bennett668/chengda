<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1200 675" role="img" aria-labelledby="figure-title figure-desc" xml:lang="zh-Hant"><title id="figure-title">塞蓋關上了，水從哪裏流走？</title><desc id="figure-desc">兩幅洗手盆剖面示意。左：盆內蓄水繞過未密合的塞蓋，進入排水管中央。右：以帶溢水開口的去水器為例，蓄水繞過固定法蘭密封，經側面溢水開口進入排水管內；此時櫃內仍可能乾燥。其他向外漏水須另行檢查。</desc><defs><marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#2563a8"/></marker><marker id="arrow-gray" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#7a8088"/></marker></defs><style>text{font-family:Inter,"PingFang TC",Arial,sans-serif;letter-spacing:0}svg{background:#fff}</style><rect width="1200" height="675" fill="#fff"/><text x="58" y="49" font-size="15" fill="#2563a8" font-weight="500" text-anchor="start">CHENGDA  /  衛浴科普</text><text x="58" y="111" font-size="36" fill="#14171b" font-weight="600" text-anchor="start">塞蓋關上了，水從哪裏流走？</text><text x="58" y="153" font-size="22" fill="#7a8088" font-weight="400" text-anchor="start">活動塞蓋與固定落水法蘭，密封的是不同位置。</text><path d="M58 184H1142" stroke="#e6e8ec" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="310" y="239" font-size="27" fill="#14171b" font-weight="600" text-anchor="middle">繞過塞蓋密封處</text><text x="880" y="230" font-size="25" fill="#14171b" font-weight="600" text-anchor="middle">繞過法蘭，再經側孔入管</text><text x="880" y="260" font-size="20" fill="#7a8088" font-weight="400" text-anchor="middle">帶溢水開口去水器的例子</text><path d="M155 327H465Q436 395 353 406H267Q184 395 155 327Z" stroke="none" stroke-width="0" fill="#eef4fa" stroke-linejoin="round" stroke-linecap="round" /><path d="M120 276Q152 382 249 404L278 407V425L244 422Q141 400 106 280" stroke="#14171b" stroke-width="4" fill="#fff" stroke-linejoin="round" stroke-linecap="round" /><path d="M500 276Q468 382 371 404L342 407V425L376 422Q