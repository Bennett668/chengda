#arrow-blue)"/><path d="M388 493H463" stroke="#7a8088" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="470" y="486" font-size="20" fill="#7a8088" font-weight="400" text-anchor="start">進入</text><text x="470" y="512" font-size="20" fill="#7a8088" font-weight="400" text-anchor="start">排水管</text><path d="M828 404L835 411" stroke="#fff" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M814 422V480H843M946 422V480H917" stroke="#7a8088" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><rect x="818" y="475" width="26" height="8" rx="0" stroke="#7a8088" stroke-width="1" fill="#e6e8ec" /><rect x="916" y="475" width="26" height="8" rx="0" stroke="#7a8088" stroke-width="1" fill="#e6e8ec" /><rect x="839" y="440" width="20" height="15" rx="0" stroke="none" stroke-width="0" fill="#fff" /><path d="M843 440H855M843 455H855" stroke="#7a8088" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M795 351C817 365 830 376 831 401V435Q831 448 848 448H858Q866 448 866 463V506" stroke="#2563a8" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/><path d="M858 448L962 465H974" stroke="#7a8088" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="982" y="461" font-size="20" fill="#7a8088" font-weight="400" text-anchor="start">側面開口</text><text x="982" y="487" font-size="20" fill="#7a8088" font-weight="400" text-anchor="start">通向管內</text><text x="310" y="564" font-size="22" fill="#7a8088" font-weight="400" text-anchor="middle">水路通向下水管內</text><text x="880" y="564" font-size="22" fill="#7a8088" font-weight="400" text-anchor="middle">櫃內仍可能保持乾燥</text><path d="M58 598H1142" stroke="#e6e8ec" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="58" y="639" font-size="20" fill="#7a8088" font-weight="400" text-anchor="start">以帶溢水開口的去水器作結構示意；其他向外漏水須另行檢查。</text></svg>