<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1200 675" role="img" aria-labelledby="figure-title figure-desc" xml:lang="zh-Hant"><title id="figure-title">關水後：剩下的水，還是仍有新水通過？</title><desc id="figure-desc">兩個已關閉把手的龍頭示意。左：龍頭內關斷有效，上游新水被擋住，下游有限殘水仍可能排出。右：內部關斷不嚴，新水仍可持續流到出水口。圖中不設定通用正常滴水時限。</desc><defs><marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#2563a8"/></marker><marker id="arrow-gray" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#7a8088"/></marker></defs><style>text{font-family:Inter,"PingFang TC",Arial,sans-serif;letter-spacing:0}svg{background:#fff}</style><rect width="1200" height="675" fill="#fff"/><text x="58" y="49" font-size="15" fill="#2563a8" font-weight="500" text-anchor="start">CHENGDA  /  衛浴科普</text><text x="58" y="111" font-size="36" fill="#14171b" font-weight="600" text-anchor="start">關水後：剩下的水，還是仍有新水通過？</text><text x="58" y="153" font-size="22" fill="#7a8088" font-weight="400" text-anchor="start">分清龍頭關斷位置上游的供水，與下游的殘水。</text><path d="M58 184H1142" stroke="#e6e8ec" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="310" y="238" font-size="27" fill="#14171b" font-weight="600" text-anchor="middle">下游殘水：有限</text><text x="880" y="238" font-size="27" fill="#14171b" font-weight="600" text-anchor="middle">關斷不嚴：仍有水通過</text><path d="M203 509V328Q203 293 238 293H421V332H250V509" stroke="#14171b" stroke-width="4" fill="#fff" stroke-linejoin="round" stroke-linecap="round" /><path d="M396 293V342H423V293" stroke="#14171b" stroke-width="3" fill="#fff" stroke-linejoin="round" stroke-linecap="round" /><path d="M197 377H255" stroke="#14171b" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="225" cy="377" r="22" stroke="#14171b" stroke-width="3" fill="#fff" /><path d="M225 369