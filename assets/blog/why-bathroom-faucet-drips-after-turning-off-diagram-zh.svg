stroke="#e6e8ec" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="58" y="639" font-size="20" fill="#7a8088" font-weight="400" text-anchor="start">簡化機制示意。須配合龍頭結構判斷；沒有適用於所有型號的滴水時限。</text></svg>