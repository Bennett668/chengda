<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1200 675" role="img" aria-labelledby="figure-title figure-desc" xml:lang="en"><title id="figure-title">Tank cleaners: the contact path matters</title><desc id="figure-desc">Three illustrated contact routes: a tablet placed directly in tank water beside internal valves, cleaner applied to the toilet bowl, and a separate manufacturer-designed reservoir leading toward the bowl. Only the exact approved products and systems determine compatibility.</desc><defs><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2563a8"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#7a8088"/></marker></defs><style>text{font-family:Inter,"PingFang TC",Arial,sans-serif;letter-spacing:0}svg{background:#fff}</style><rect width="1200" height="675" fill="#fff"/><text x="58" y="49" font-size="15" fill="#2563a8" font-weight="500" text-anchor="start">CHENGDA  /  BATHROOM SCIENCE</text><text x="58" y="111" font-size="36" fill="#14171b" font-weight="600" text-anchor="start">Tank cleaners: the contact path matters</text><text x="58" y="153" font-size="22" fill="#7a8088" font-weight="400" text-anchor="start">These are three different uses, not three interchangeable methods.</text><path d="M58 184H1142" stroke="#e6e8ec" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="220" y="237" font-size="25" fill="#14171b" font-weight="600" text-anchor="middle">Directly in the tank</text><text x="601" y="237" font-size="25" fill="#14171b" font-weight="600" text-anchor="middle">Bowl cleaning</text><text x="979" y="237" font-size="25" fill="#14171b" font-weight="600" text-anchor="middle">Dedicated system</text><rect x="97" y="285" width="249" height="195" rx="8" stroke="#14171b" stroke-wid