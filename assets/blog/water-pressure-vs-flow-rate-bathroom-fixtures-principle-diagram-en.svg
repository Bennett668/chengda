<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1200 675" role="img"><title>Water pressure is not flow rate</title><style>svg{--ink:#14171b;--accent:#2563a8;--paper:#fff;font-family:Inter,"Noto Sans TC","PingFang TC",Arial,sans-serif}text{letter-spacing:0}</style><rect width="1200" height="675" fill="#fff"/><text x="58" y="52" font-size="15" font-weight="500" fill="#2563a8" text-anchor="start">CHENGDA  /  BATHROOM SCIENCE</text><text x="58" y="120" font-size="40" font-weight="600" fill="var(--ink)" text-anchor="start">Water pressure is not flow rate</text><text x="58" y="161" font-size="22" font-weight="400" fill="#7a8088" text-anchor="start">Three readings answer three different questions.</text><path d="M58 191 H1142" stroke="#e6e8ec"/><text x="58" y="235" font-size="16" font-weight="500" fill="#2563a8" text-anchor="start">01</text><g transform="translate(115 268) scale(1.04)" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="89" cy="65" r="49" fill="var(--paper)"/><path d="M89 65 L112 36" stroke="var(--accent)"/><path d="M89 114 V144 M20 144 H167"/><path d="M148 132 L160 154 M160 132 L148 154" stroke="var(--accent)"/></g><text x="58" y="479" font-size="26" font-weight="600" fill="var(--ink)" text-anchor="start">Static pressure</text><text x="58" y="519" font-size="23" font-weight="400" fill="#2c3138" text-anchor="start">Pressure at the test point</text><text x="58" y="551" font-size="23" font-weight="400" fill="#2c3138" text-anchor="start">when water is not flowing.</text><path d="M408 220 V560" stroke="#e6e8ec"/><text x="431" y="235" font-size="16" font-weight="500" fill="#2563a8" text-anchor="start">02</text><g transform="translate(488 268) scale(1.04)" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="89" cy="65" r="49" fill="var(--paper)"/><path d="M89 65 L112 36" stroke="var(--accent)"/><path d="M89 114 V144 M20 144 H167"/><path d="M153 144 H179 M168 135 L180 144 L168 153" stroke="var(--accent)"/></g><text x="431" y="479" font-size="26" font-weight="600" fill="var(--ink)" text-anchor="start">Running pressure</text><text x="431" y="519" font-size="23" font-weight="400" fill="#2c3138" text-anchor="start">Pressure at the test point</text><text x="431" y="551" font-size="23" font-weight="400" fill="#2c3138" text-anchor="start">under stated flow conditions.</text><path d="M781 220 V560" stroke="#e6e8ec"/><text x="804" y="235" font-size="16" font-weight="500" fill="#2563a8" text-anchor="start">03</text><g transform="translate(861 268) scale(1.04)" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M39 42 L50 147 H136 L147 42" fill="var(--paper)"/><path d="M47 105 H139" stroke="var(--accent)"/><path d="M90 10 V79 M81 70 L90 82 L99 70" stroke="var(--accent)"/><path d="M61 124 H77 M61 100 H77 M61 76 H77"/></g><text x="804" y="479" font-size="26" font-weight="600" fill="var(--ink)" text-anchor="start">Flow rate</text><text x="804" y="519" font-size="23" font-weight="400" fill="#2c3138" text-anchor="start">Volume delivered per time.</text><text x="804" y="551" font-size="23" font-weight="400" fill="#2c3138" text-anchor="start">Example: 1 L / 10 s = 6 L/min.</text><path d="M58 591 H1142" stroke="#e6e8ec"/><text x="58" y="634" font-size="19" font-weight="400" fill="#7a8088" text-anchor="start">Arithmetic example only, not a product requirement or measured result.</text></svg>