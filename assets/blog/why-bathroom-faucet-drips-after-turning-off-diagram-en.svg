<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1200 675" role="img" aria-labelledby="figure-title figure-desc" xml:lang="en"><title id="figure-title">After shutoff: leftover water or new water?</title><desc id="figure-desc">Two schematic faucets, with their handles in the closed position. Left: an effective internal shutoff blocks new supply, while a finite amount of downstream water can empty. Right: an imperfect internal shutoff allows new supply to keep reaching the spout. No universal time limit is indicated.</desc><defs><marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#2563a8"/></marker><marker id="arrow-gray" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#7a8088"/></marker></defs><style>text{font-family:Inter,"PingFang TC",Arial,sans-serif;letter-spacing:0}svg{background:#fff}</style><rect width="1200" height="675" fill="#fff"/><text x="58" y="49" font-size="15" fill="#2563a8" font-weight="500" text-anchor="start">CHENGDA  /  BATHROOM SCIENCE</text><text x="58" y="111" font-size="36" fill="#14171b" font-weight="600" text-anchor="start">After shutoff: leftover water or new water?</text><text x="58" y="153" font-size="22" fill="#7a8088" font-weight="400" text-anchor="start">Follow the water on each side of the faucet’s shutoff point.</text><path d="M58 184H1142" stroke="#e6e8ec" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="310" y="238" font-size="27" fill="#14171b" font-weight="600" text-anchor="middle">Finite water downstream</text><text x="880" y="238" font-size="27" fill="#14171b" font-weight="600" text-anchor="middle">Water keeps passing the shutoff</text><path d="M203 509V328Q203 293 238 293H421V332H250V509" stroke="#14171b" stroke-width="4" fill="#fff" stroke-linejoin="round" stroke-linecap="round" /><path d="M396 293V342H423V293" stroke="#14171b" stroke-width="3" fill="#fff" stroke-linejoin="round" stroke-linecap="round" /><path d="M197 377H255" stroke="#14171b" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="225" cy="377" r="22" stroke="#14171b" stroke-width="3" fill="#fff" /><path d="M225 369V321L257 306" stroke="#14171b" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M226 494V410" stroke="#2563a8" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/><path d="M208 376H242" stroke="#14171b" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M259 323H411V340" stroke="#2563a8" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M335 323H411V354" stroke="#2563a8" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/><g transform="translate(411 388) scale(0.85)"><path d="M0 -11C-4 -5 -7 0 -7 5A7 7 0 0 0 7 5C7 0 4 -5 0 -11Z" stroke="#2563a8" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round" /></g><path d="M411 416V459" stroke="#7a8088" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 9"/><path d="M174 446H133" stroke="#7a8088" stroke-width="1.4" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="125" y="451" font-size="20" fill="#7a8088" font-weight="400" text-anchor="end">Supply</text><path d="M248 385H281" stroke="#7a8088" stroke-width="1.4" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="284" y="380" font-size="17" fill="#7a8088" font-weight="400" text-anchor="start">Shutoff</text><text x="284" y="405" font-size="17" fill="#7a8088" font-weight="400" text-anchor="start">inside tap</text><path d="M773 509V328Q773 293 808 293H991V332H820V509" stroke="#14171b" stroke-width="4" fill="#fff" stroke-linejoin="round" stroke-linecap="round" /><path d="M966 293V342H993V293" stroke="#14171b" stroke-width="3" fill="#fff" stroke-linejoin="round" stroke-linecap="round" /><path d="M767 377H825" stroke="#14171b" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="795" cy="377" r="22" stroke="#14171b" stroke-width="3" fill="#fff" /><path d="M795 369V321L827 306" stroke="#14171b" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M796 494V410" stroke="#2563a8" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/><path d="M778 376H789M802 376H812" stroke="#14171b" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M796 408V348Q796 315 827 315H981V353" stroke="#2563a8" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/><g transform="translate(981 380) scale(0.85)"><path d="M0 -11C-4 -5 -7 0 -7 5A7 7 0 0 0 7 5C7 0 4 -5 0 -11Z" stroke="#2563a8" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round" /></g><g transform="translate(981 422) scale(0.85)"><path d="M0 -11C-4 -5 -7 0 -7 5A7 7 0 0 0 7 5C7 0 4 -5 0 -11Z" stroke="#2563a8" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round" /></g><g transform="translate(981 464) scale(0.85)"><path d="M0 -11C-4 -5 -7 0 -7 5A7 7 0 0 0 7 5C7 0 4 -5 0 -11Z" stroke="#2563a8" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round" /></g><path d="M744 446H703" stroke="#7a8088" stroke-width="1.4" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="695" y="451" font-size="20" fill="#7a8088" font-weight="400" text-anchor="end">Supply</text><path d="M818 385H851" stroke="#7a8088" stroke-width="1.4" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="854" y="380" font-size="17" fill="#7a8088" font-weight="400" text-anchor="start">Shutoff</text><text x="854" y="405" font-size="17" fill="#7a8088" font-weight="400" text-anchor="start">inside tap</text><text x="310" y="554" font-size="23" fill="#2563a8" font-weight="500" text-anchor="middle">It eventually stops</text><text x="880" y="554" font-size="23" fill="#2563a8" font-weight="500" text-anchor="middle">More water can keep arriving</text><path d="M58 598H1142" stroke="#e6e8ec" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="58" y="639" font-size="20" fill="#7a8088" font-weight="400" text-anchor="start">Simplified mechanism. Faucet design matters; no single drip-duration rule fits every model.</text></svg>