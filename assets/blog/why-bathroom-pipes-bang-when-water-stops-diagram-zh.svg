<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1200 675" role="img" aria-labelledby="figure-title figure-desc" xml:lang="zh-Hant"><title id="figure-title">流水遇上快速關閉的閥門</title><desc id="figure-desc">同一條供水管的三個連續狀態：水流向開啟的閥門、閥門快速關閉、壓力擾動沿管道向上游傳播。圖示只說明概念，不是數值模型，亦不能單憑聲響確診。</desc><defs><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2563a8"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#7a8088"/></marker></defs><style>text{font-family:Inter,"PingFang TC",Arial,sans-serif;letter-spacing:0}svg{background:#fff}</style><rect width="1200" height="675" fill="#fff"/><text x="58" y="49" font-size="15" fill="#2563a8" font-weight="500" text-anchor="start">CHENGDA  /  衛浴科普</text><text x="58" y="111" font-size="36" fill="#14171b" font-weight="600" text-anchor="start">流水遇上快速關閉的閥門</text><text x="58" y="153" font-size="22" fill="#7a8088" font-weight="400" text-anchor="start">供水管內瞬態壓力的簡化過程。</text><path d="M58 184H1142" stroke="#e6e8ec" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="80" cy="251" r="19" stroke="#2563a8" stroke-width="1.5" fill="#fff" /><text x="80" y="258" font-size="21" fill="#2563a8" font-weight="600" text-anchor="middle">1</text><text x="114" y="259" font-size="25" fill="#14171b" font-weight="600" text-anchor="start">水正在流動</text><path d="M447 225H1095M447 277H1095" stroke="#14171b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="982" cy="251" r="27" stroke="#14171b" stroke-width="3" fill="#fff" /><path d="M956 251H1008" stroke="#14171b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M473 251H634" stroke="#2563a8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M692 251H889" stroke="#2563a8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M1031 251H1083" stroke="#2563a8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><circle cx="80" cy="375" r="19" stroke="#2563a8" stroke-width="1.5" fill="#fff" /><text x="80" y="382" font-size="21" fill="#2563a8" font-weight="600" text-anchor="middle">2</text><text x="114" y="383" font-size="25" fill="#14171b" font-weight="600" text-anchor="start">閥門快速關閉</text><path d="M447 349H1095M447 401H1095" stroke="#14171b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="982" cy="375" r="27" stroke="#14171b" stroke-width="3" fill="#fff" /><path d="M982 349V401" stroke="#14171b" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M525 375H710" stroke="#2563a8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M793 375H928" stroke="#2563a8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M959 320Q994 313 1008 336" stroke="#7a8088" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><circle cx="80" cy="501" r="19" stroke="#2563a8" stroke-width="1.5" fill="#fff" /><text x="80" y="508" font-size="21" fill="#2563a8" font-weight="600" text-anchor="middle">3</text><text x="114" y="509" font-size="25" fill="#14171b" font-weight="600" text-anchor="start">壓力波向上游傳播</text><path d="M447 475H1095M447 527H1095" stroke="#14171b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="982" cy="501" r="27" stroke="#14171b" stroke-width="3" fill="#fff" /><path d="M982 475V527" stroke="#14171b" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M924 501H500" stroke="#2563a8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M736 484Q719 501 736 518" stroke="#2563a8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M826 484Q809 501 826 518" stroke="#2563a8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M910 484Q893 501 910 518" stroke="#2563a8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="980" y="208" font-size="20" fill="#7a8088" font-weight="400" text-anchor="middle">閥門</text><text x="663" y="553" font-size="20" fill="#7a8088" font-weight="400" text-anchor="middle">表示壓力波傳播，並非持續倒流</text><path d="M58 590H1142" stroke="#e6e8ec" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="58" y="632" font-size="20" fill="#7a8088" font-weight="400" text-anchor="start">概念示意，並非精確水力模型；單憑敲擊聲不能確診為水錘。</text></svg>