<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1200 675" role="img" aria-labelledby="figure-title figure-desc" xml:lang="zh-Hant"><title id="figure-title">緩降異常：分開看三個部位</title><desc id="figure-desc">分層側視圖將蓋子、座圈及鉸鏈底座分開；弧線箭頭表示分別觀察蓋子與座圈下降，水平箭頭提示檢查底座是否鬆動。機構只作示意。</desc><defs><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2563a8"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#7a8088"/></marker></defs><style>text{font-family:Inter,"PingFang TC",Arial,sans-serif;letter-spacing:0}svg{background:#fff}</style><rect width="1200" height="675" fill="#fff"/><text x="58" y="49" font-size="15" fill="#2563a8" font-weight="500" text-anchor="start">CHENGDA  /  衛浴科普</text><text x="58" y="111" font-size="36" fill="#14171b" font-weight="600" text-anchor="start">緩降異常：分開看三個部位</text><text x="58" y="153" font-size="22" fill="#7a8088" font-weight="400" text-anchor="start">蓋子、座圈與底座，各自負責不同功能。</text><path d="M58 184H1142" stroke="#e6e8ec" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M449 303L647 209Q658 203 666 213Q673 225 660 232L462 326Z" stroke="#14171b" stroke-width="4" fill="#fff" stroke-linecap="round" stroke-linejoin="round" /><circle cx="451" cy="321" r="12" stroke="#14171b" stroke-width="3" fill="#fff" /><path d="M461 324H713" stroke="#7a8088" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 8"/><path d="M653 247Q688 269 697 312" stroke="#2563a8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M452 397L720 352Q735 350 738 362Q740 374 725 377L454 418Z" stroke="#14171b" stroke-width="4" fill="#fff" stroke-linecap="round" stroke-linejoin="round" /><circle cx="451" cy="408" r="12" stroke="#14171b" stroke-width="3" fill="#fff" /><path d="M465 411H750" stroke="#7a8088" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 8"/><path d="M734 386Q749 397 751 408" stroke="#2563a8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M449 337V382M449 425V456" stroke="#7a8088" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><rect x="409" y="466" width="93" height="21" rx="5" stroke="#14171b" stroke-width="3" fill="#fff" /><path d="M428 488V525M480 488V525" stroke="#14171b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M364 503H797Q820 503 832 521H356" stroke="#7a8088" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M410 546H500" stroke="#2563a8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M500 559H410" stroke="#2563a8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><circle cx="88" cy="252" r="19" stroke="#2563a8" stroke-width="1.5" fill="#fff" /><text x="88" y="259" font-size="21" fill="#2563a8" font-weight="600" text-anchor="middle">1</text><text x="121" y="260" font-size="27" fill="#14171b" font-weight="600" text-anchor="start">蓋子下降</text><text x="121" y="300" font-size="22" fill="#7a8088" font-weight="400" text-anchor="start">單獨觀察動作</text><path d="M313 268H363L495 283" stroke="#7a8088" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><circle cx="865" cy="350" r="19" stroke="#2563a8" stroke-width="1.5" fill="#fff" /><text x="865" y="357" font-size="21" fill="#2563a8" font-weight="600" text-anchor="middle">2</text><text x="898" y="358" font-size="27" fill="#14171b" font-weight="600" text-anchor="start">座圈下降</text><text x="898" y="398" font-size="22" fill="#7a8088" font-weight="400" text-anchor="start">另一個獨立</text><text x="898" y="429" font-size="22" fill="#7a8088" font-weight="400" text-anchor="start">活動部件</text><path d="M838 369H787L727 370" stroke="#7a8088" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><circle cx="88" cy="475" r="19" stroke="#2563a8" stroke-width="1.5" fill="#fff" /><text x="88" y="482" font-size="21" fill="#2563a8" font-weight="600" text-anchor="middle">3</text><text x="121" y="483" font-size="27" fill="#14171b" font-weight="600" text-anchor="start">底座固定</text><text x="121" y="523" font-size="22" fill="#7a8088" font-weight="400" text-anchor="start">檢查有否鬆動位移</text><path d="M322 480H399" stroke="#7a8088" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><path d="M58 590H1142" stroke="#e6e8ec" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="58" y="632" font-size="20" fill="#7a8088" font-weight="400" text-anchor="start">動作只作示意；不同型號的鉸鏈結構及可更換部件並不相同。</text></svg>