<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1200 675" role="img"><title>沒有沖水，為何自己補水？</title><style>svg{--ink:#14171b;--accent:#2563a8;--paper:#fff;font-family:Inter,"Noto Sans TC","PingFang TC",Arial,sans-serif}text{letter-spacing:0}</style><rect width="1200" height="675" fill="#fff"/><text x="58" y="52" font-size="15" font-weight="500" fill="#2563a8" text-anchor="start">CHENGDA  /  BATHROOM SCIENCE</text><text x="58" y="120" font-size="43" font-weight="600" fill="var(--ink)" text-anchor="start">沒有沖水，為何自己補水？</text><text x="58" y="161" font-size="22" font-weight="400" fill="#7a8088" text-anchor="start">儲水式馬桶水箱可能出現的一種循環。</text><path d="M58 191 H1142" stroke="#e6e8ec"/><text x="58" y="235" font-size="16" font-weight="500" fill="#2563a8" text-anchor="start">01</text><g transform="translate(115 268) scale(1.04)" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12 H167 V141 H22Z" fill="var(--paper)"/><path d="M15 8 H174"/><path d="M30 62 H159" stroke="var(--accent)"/><path d="M86 136 H111" stroke="var(--accent)" stroke-width="8"/><path d="M99 145 V167 M91 159 L99 169 L107 159" stroke="var(--accent)"/></g><text x="58" y="479" font-size="26" font-weight="600" fill="var(--ink)" text-anchor="start">水從水箱流走</text><text x="58" y="519" font-size="23" font-weight="400" fill="#2c3138" text-anchor="start">排水閥密封滲漏，可能</text><text x="58" y="551" font-size="23" font-weight="400" fill="#2c3138" text-anchor="start">讓水流入馬桶內。</text><path d="M408 220 V560" stroke="#e6e8ec"/><text x="431" y="235" font-size="16" font-weight="500" fill="#2563a8" text-anchor="start">02</text><g transform="translate(488 268) scale(1.04)" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12 H167 V141 H22Z" fill="var(--paper)"/><path d="M15 8 H174"/><path d="M30 67 H159" stroke-dasharray="6 7"/><path d="M30 105 H159" stroke="var(--accent)"/><path d="M90 74 V95 M84 89 L90 97 L96 89" stroke="var(--accent)"/></g><text x="431" y="479" font-size="26" font-weight="600" fill="var(--ink)" text-anchor="start">水位逐漸下降</text><text x="431" y="519" font-size="23" font-weight="400" fill="#2c3138" text-anchor="start">水位降低後，</text><text x="431" y="551" font-size="23" font-weight="400" fill="#2c3138" text-anchor="start">進水閥開始補水。</text><path d="M781 220 V560" stroke="#e6e8ec"/><text x="804" y="235" font-size="16" font-weight="500" fill="#2563a8" text-anchor="start">03</text><g transform="translate(861 268) scale(1.04)" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12 H167 V141 H22Z" fill="var(--paper)"/><path d="M15 8 H174"/><path d="M48 144 V40 H73 V75" stroke="var(--accent)"/><path d="M65 68 L73 78 L81 68" stroke="var(--accent)"/><path d="M30 88 H159" stroke="var(--accent)"/></g><text x="804" y="479" font-size="26" font-weight="600" fill="var(--ink)" text-anchor="start">水箱再次補滿</text><text x="804" y="519" font-size="23" font-weight="400" fill="#2c3138" text-anchor="start">如果水繼續流失，</text><text x="804" y="551" font-size="23" font-weight="400" fill="#2c3138" text-anchor="start">補水循環可能重複。</text><path d="M58 591 H1142" stroke="#e6e8ec"/><text x="58" y="634" font-size="19" font-weight="400" fill="#7a8088" text-anchor="start">亦可能有其他原因。檢查方法與配件須按型號確認。</text></svg>