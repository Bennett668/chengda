<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1200 675" role="img"><title>A practical path for weak flow</title><style>text{font-family:Inter,"Noto Sans TC","PingFang TC",Arial,sans-serif}</style><rect width="1200" height="675" fill="#fff"/><text x="58" y="52" font-size="15" fill="#2563a8" font-weight="500">CHENGDA  /  PRACTICAL CARE</text><text x="58" y="125" font-size="40" fill="#14171b" font-weight="600">A practical path for weak flow</text><path d="M58 176H1142" stroke="#e6e8ec"/><text x="58" y="297" font-size="76" fill="#2563a8" font-weight="500">01</text><text x="58" y="385" font-size="29" fill="#14171b" font-weight="600">Compare</text><text x="58" y="439" font-size="22" fill="#51565e" font-weight="400">One outlet, hot water or all?</text><text x="58" y="477" font-size="22" fill="#51565e" font-weight="400">Test under the same conditions.</text><path d="M408 216V547" stroke="#e6e8ec"/><text x="431" y="297" font-size="76" fill="#2563a8" font-weight="500">02</text><text x="431" y="385" font-size="29" fill="#14171b" font-weight="600">Act</text><text x="431" y="439" font-size="22" fill="#51565e" font-weight="400">Clean user-serviceable parts.</text><text x="431" y="477" font-size="22" fill="#51565e" font-weight="400">Match wider faults to support.</text><path d="M781 216V547" stroke="#e6e8ec"/><text x="804" y="297" font-size="76" fill="#2563a8" font-weight="500">03</text><text x="804" y="385" font-size="29" fill="#14171b" font-weight="600">Measure again</text><text x="804" y="439" font-size="22" fill="#51565e" font-weight="400">Use the same outlet and timing.</text><text x="804" y="477" font-size="22" fill="#51565e" font-weight="400">Flow does not measure pressure.</text><path d="M58 587H1142" stroke="#e6e8ec"/><text x="58" y="631" font-size="19" fill="#7a8088" font-weight="400">Follow the model-specific steps in the article.</text></svg>