<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1200 675" role="img" aria-labelledby="figure-title figure-desc" xml:lang="en"><title id="figure-title">A closed stopper: where can the water go?</title><desc id="figure-desc">Two schematic basin cross-sections. Left: held water passes a poorly sealing stopper into the centre of the drain. Right: in an overflow-drain example, held water bypasses the fixed flange seal, enters a side overflow opening and then flows inside the drain. In this second route, the cabinet can remain dry. External leaks require separate checks.</desc><defs><marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#2563a8"/></marker><marker id="arrow-gray" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#7a8088"/></marker></defs><style>text{font-family:Inter,"PingFang TC",Arial,sans-serif;letter-spacing:0}svg{background:#fff}</style><rect width="1200" height="675" fill="#fff"/><text x="58" y="49" font-size="15" fill="#2563a8" font-weight="500" text-anchor="start">CHENGDA  /  BATHROOM SCIENCE</text><text x="58" y="111" font-size="36" fill="#14171b" font-weight="600" text-anchor="start">A closed stopper: where can the water go?</text><text x="58" y="153" font-size="22" fill="#7a8088" font-weight="400" text-anchor="start">The moving stopper and the fixed drain flange seal different places.</text><path d="M58 184H1142" stroke="#e6e8ec" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="310" y="239" font-size="27" fill="#14171b" font-weight="600" text-anchor="middle">Past the stopper</text><text x="880" y="230" font-size="25" fill="#14171b" font-weight="600" text-anchor="middle">Past the flange, through a side opening</text><text x="880" y="260" font-size="20" fill="#7a8088" font-weight="400" text-anchor="middle">An overflow-drain example</text><path d="M155 327H465Q436 395 353 406H267Q184 395 155 327Z" stroke="none" stroke-width="0" fill="#eef4fa" stroke-linejoin="round" stroke-linecap="round" /><path d="M120 276Q152 382 249 404L278 407V425L244 422Q141 400 106 280" stroke="#14171b" stroke-width="4" fill="#fff" stroke-linejoin="round" stroke-linecap="round" /><path d="M500 276Q468 382 371 404L342 407V425L376 422Q479 400 514 280" stroke="#14171b" stroke-width="4" fill="#fff" stroke-linejoin="round" stroke-linecap="round" /><path d="M157 327H463" stroke="#2563a8" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M253 404H285V532H273V419H253Z" stroke="#14171b" stroke-width="3" fill="#fff" stroke-linejoin="round" stroke-linecap="round" /><path d="M367 404H335V532H347V419H367Z" stroke="#14171b" stroke-width="3" fill="#fff" stroke-linejoin="round" stroke-linecap="round" /><path d="M310 399V469" stroke="#7a8088" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" /><rect x="271" y="390" width="78" height="13" rx="6" stroke="#14171b" stroke-width="3" fill="#fff" /><path d="M725 327H1035Q1006 395 923 406H837Q754 395 725 327Z" stroke="none" stroke-width="0" fill="#eef4fa" stroke-linejoin="round" stroke-linecap="round" /><path d="M690 276Q722 382 819 404L848 407V425L814 422Q711 400 676 280" stroke="#14171b" stroke-width="4" fill="#fff" stroke-linejoin="round" stroke-linecap="round" /><path d="M1070 276Q1038 382 941 404L912 407V425L946 422Q1049 400 1084 280" stroke="#14171b" stroke-width="4" fill="#fff" stroke-linejoin="round" stroke-linecap="round" /><path d="M727 327H1033" stroke="#2563a8" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M823 404H855V532H843V419H823Z" stroke="#14171b" stroke-width="3" fill="#fff" stroke-linejoin="round" stroke-linecap="round" /><path d="M937 404H905V532H917V419H937Z" stroke="#14171b" stroke-width="3" fill="#fff" stroke-linejoin="round" stroke-linecap="round" /><path d="M880 399V469" stroke="#7a8088" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" /><rect x="841" y="390" width="78" height="13" rx="6" stroke="#14171b" stroke-width="3" fill="#fff" /><path d="M402 350C380 362 356 364 354 387C353 407 331 417 326 444V500" stroke="#2563a8" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/><path d="M388 493H463" stroke="#7a8088" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="470" y="486" font-size="20" fill="#7a8088" font-weight="400" text-anchor="start">Into</text><text x="470" y="512" font-size="20" fill="#7a8088" font-weight="400" text-anchor="start">the drain</text><path d="M828 404L835 411" stroke="#fff" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M814 422V480H843M946 422V480H917" stroke="#7a8088" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><rect x="818" y="475" width="26" height="8" rx="0" stroke="#7a8088" stroke-width="1" fill="#e6e8ec" /><rect x="916" y="475" width="26" height="8" rx="0" stroke="#7a8088" stroke-width="1" fill="#e6e8ec" /><rect x="839" y="440" width="20" height="15" rx="0" stroke="none" stroke-width="0" fill="#fff" /><path d="M843 440H855M843 455H855" stroke="#7a8088" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M795 351C817 365 830 376 831 401V435Q831 448 848 448H858Q866 448 866 463V506" stroke="#2563a8" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/><path d="M858 448L962 465H974" stroke="#7a8088" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="982" y="461" font-size="20" fill="#7a8088" font-weight="400" text-anchor="start">Side opening</text><text x="982" y="487" font-size="20" fill="#7a8088" font-weight="400" text-anchor="start">into the drain</text><text x="310" y="564" font-size="22" fill="#7a8088" font-weight="400" text-anchor="middle">A route into the waste pipe</text><text x="880" y="564" font-size="22" fill="#7a8088" font-weight="400" text-anchor="middle">The cabinet can stay dry</text><path d="M58 598H1142" stroke="#e6e8ec" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="58" y="639" font-size="20" fill="#7a8088" font-weight="400" text-anchor="start">Schematic overflow-drain example. Other external leaks require separate checks.</text></svg>