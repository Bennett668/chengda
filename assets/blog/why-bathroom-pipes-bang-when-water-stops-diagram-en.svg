<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1200 675" role="img" aria-labelledby="figure-title figure-desc" xml:lang="en"><title id="figure-title">When flowing water meets a closing valve</title><desc id="figure-desc">Three successive views of one supply pipe: water flows toward an open valve, the valve closes rapidly, and a pressure disturbance travels back along the pipe. The diagram is conceptual, not a numerical model or a diagnosis from noise alone.</desc><defs><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2563a8"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#7a8088"/></marker></defs><style>text{font-family:Inter,"PingFang TC",Arial,sans-serif;letter-spacing:0}svg{background:#fff}</style><rect width="1200" height="675" fill="#fff"/><text x="58" y="49" font-size="15" fill="#2563a8" font-weight="500" text-anchor="start">CHENGDA  /  BATHROOM SCIENCE</text><text x="58" y="111" font-size="36" fill="#14171b" font-weight="600" text-anchor="start">When flowing water meets a closing valve</text><text x="58" y="153" font-size="22" fill="#7a8088" font-weight="400" text-anchor="start">A simplified sequence of a pressure transient in a supply pipe.</text><path d="M58 184H1142" stroke="#e6e8ec" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="80" cy="251" r="19" stroke="#2563a8" stroke-width="1.5" fill="#fff" /><text x="80" y="258" font-size="21" fill="#2563a8" font-weight="600" text-anchor="middle">1</text><text x="114" y="259" font-size="25" fill="#14171b" font-weight="600" text-anchor="start">Flowing water</text><path d="M447 225H1095M447 277H1095" stroke="#14171b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="982" cy="251" r="27" stroke="#14171b" stroke-width="3" fill="#fff" /><path d="M956 251H1008" stroke="#14171b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M473 251H634" stroke="#2563a8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M692 251H889" stroke="#2563a8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M1031 251H1083" stroke="#2563a8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><circle cx="80" cy="375" r="19" stroke="#2563a8" stroke-width="1.5" fill="#fff" /><text x="80" y="382" font-size="21" fill="#2563a8" font-weight="600" text-anchor="middle">2</text><text x="114" y="383" font-size="25" fill="#14171b" font-weight="600" text-anchor="start">Rapid closure</text><path d="M447 349H1095M447 401H1095" stroke="#14171b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="982" cy="375" r="27" stroke="#14171b" stroke-width="3" fill="#fff" /><path d="M982 349V401" stroke="#14171b" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M525 375H710" stroke="#2563a8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M793 375H928" stroke="#2563a8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M959 320Q994 313 1008 336" stroke="#7a8088" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><circle cx="80" cy="501" r="19" stroke="#2563a8" stroke-width="1.5" fill="#fff" /><text x="80" y="508" font-size="21" fill="#2563a8" font-weight="600" text-anchor="middle">3</text><text x="114" y="509" font-size="25" fill="#14171b" font-weight="600" text-anchor="start">Pressure wave returns</text><path d="M447 475H1095M447 527H1095" stroke="#14171b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="982" cy="501" r="27" stroke="#14171b" stroke-width="3" fill="#fff" /><path d="M982 475V527" stroke="#14171b" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M924 501H500" stroke="#2563a8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M736 484Q719 501 736 518" stroke="#2563a8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M826 484Q809 501 826 518" stroke="#2563a8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M910 484Q893 501 910 518" stroke="#2563a8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="980" y="208" font-size="20" fill="#7a8088" font-weight="400" text-anchor="middle">Valve</text><text x="663" y="553" font-size="20" fill="#7a8088" font-weight="400" text-anchor="middle">Wave travel, not a claim of sustained reverse flow</text><path d="M58 590H1142" stroke="#e6e8ec" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="58" y="632" font-size="20" fill="#7a8088" font-weight="400" text-anchor="start">Conceptual, not a precise hydraulic model. A banging sound alone does not confirm water hammer.</text></svg>