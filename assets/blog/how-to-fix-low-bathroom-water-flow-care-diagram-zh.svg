<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1200 675" role="img"><title>浴室出水小的處理順序</title><style>text{font-family:Inter,"Noto Sans TC","PingFang TC",Arial,sans-serif}</style><rect width="1200" height="675" fill="#fff"/><text x="58" y="52" font-size="15" fill="#2563a8" font-weight="500">CHENGDA  /  PRACTICAL CARE</text><text x="58" y="125" font-size="40" fill="#14171b" font-weight="600">浴室出水小的處理順序</text><path d="M58 176H1142" stroke="#e6e8ec"/><text x="58" y="297" font-size="76" fill="#2563a8" font-weight="500">01</text><text x="58" y="385" font-size="29" fill="#14171b" font-weight="600">先比較</text><text x="58" y="439" font-size="22" fill="#51565e" font-weight="400">單一出水口、熱水或全屋？</text><text x="58" y="477" font-size="22" fill="#51565e" font-weight="400">在相同用水條件下比較。</text><path d="M408 216V547" stroke="#e6e8ec"/><text x="431" y="297" font-size="76" fill="#2563a8" font-weight="500">02</text><text x="431" y="385" font-size="29" fill="#14171b" font-weight="600">再處理</text><text x="431" y="439" font-size="22" fill="#51565e" font-weight="400">依說明清潔可自行維護部件。</text><text x="431" y="477" font-size="22" fill="#51565e" font-weight="400">較大範圍故障交對應單位。</text><path d="M781 216V547" stroke="#e6e8ec"/><text x="804" y="297" font-size="76" fill="#2563a8" font-weight="500">03</text><text x="804" y="385" font-size="29" fill="#14171b" font-weight="600">再量一次</text><text x="804" y="439" font-size="22" fill="#51565e" font-weight="400">使用同一出水口及計時方法。</text><text x="804" y="477" font-size="22" fill="#51565e" font-weight="400">流量測試不能代替測水壓。</text><path d="M58 587H1142" stroke="#e6e8ec"/><text x="58" y="631" font-size="19" fill="#7a8088" font-weight="400">具體操作及適用條件請看正文，並以該型號說明為準。</text></svg>