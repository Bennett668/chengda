<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1200 675" role="img"><title>洗手盆為甚麼有異味？</title><style>svg{--ink:#14171b;--accent:#2563a8;--paper:#fff;font-family:Inter,"Noto Sans TC","PingFang TC",Arial,sans-serif}text{letter-spacing:0}</style><rect width="1200" height="675" fill="#fff"/><text x="58" y="52" font-size="15" font-weight="500" fill="#2563a8" text-anchor="start">CHENGDA  /  BATHROOM SCIENCE</text><text x="58" y="120" font-size="43" font-weight="600" fill="var(--ink)" text-anchor="start">洗手盆為甚麼有異味？</text><text x="58" y="161" font-size="22" font-weight="400" fill="#7a8088" text-anchor="start">先了解三個位置，再判斷氣味可能來自哪裏。</text><path d="M58 191 H1142" stroke="#e6e8ec"/><text x="58" y="235" font-size="16" font-weight="500" fill="#2563a8" text-anchor="start">01</text><g transform="translate(115 268) scale(1.04)" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 18 H174 Q159 90 105 90 H78 Q25 90 8 18Z" fill="var(--paper)"/><path d="M90 91 V112"/><path d="M72 84 H108" stroke="var(--accent)" stroke-width="9"/><circle cx="76" cy="67" r="3" fill="var(--accent)"/><circle cx="110" cy="70" r="3" fill="var(--accent)"/><path d="M90 113 V135"/></g><text x="58" y="479" font-size="26" font-weight="600" fill="var(--ink)" text-anchor="start">下水器表面</text><text x="58" y="519" font-size="23" font-weight="400" fill="#2c3138" text-anchor="start">污物可能積聚在</text><text x="58" y="551" font-size="23" font-weight="400" fill="#2c3138" text-anchor="start">下水蓋及排水口附近。</text><path d="M408 220 V560" stroke="#e6e8ec"/><text x="431" y="235" font-size="16" font-weight="500" fill="#2563a8" text-anchor="start">02</text><g transform="translate(488 268) scale(1.04)" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 18 H174 Q159 90 105 90 H78 Q25 90 8 18Z" fill="var(--paper)"/><path d="M90 91 V112"/><circle cx="147" cy="38" r="6" stroke="var(--accent)"/><path d="M150 47 Q140 90 115 102 L91 112" stroke="var(--accent)" stroke-dasharray="8 7"/></g><text x="431" y="479" font-size="26" font-weight="600" fill="var(--ink)" text-anchor="start">溢水通道</text><text x="431" y="519" font-size="23" font-weight="400" fill="#2c3138" text-anchor="start">隱藏通道也可能</text><text x="431" y="551" font-size="23" font-weight="400" fill="#2c3138" text-anchor="start">需要按相容方法清潔。</text><path d="M781 220 V560" stroke="#e6e8ec"/><text x="804" y="235" font-size="16" font-weight="500" fill="#2563a8" text-anchor="start">03</text><g transform="translate(861 268) scale(1.04)" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M36 7 V83 Q36 137 86 137 Q136 137 136 83 V60 H182" stroke-width="21"/><path d="M36 74 V83 Q36 137 86 137 Q136 137 136 83 V74" stroke="var(--accent)" stroke-width="12"/><path d="M173 59 H151" stroke-dasharray="4 5"/></g><text x="804" y="479" font-size="26" font-weight="600" fill="var(--ink)" text-anchor="start">存水彎水封</text><text x="804" y="519" font-size="23" font-weight="400" fill="#2c3138" text-anchor="start">彎管留住的水，有助</text><text x="804" y="551" font-size="23" font-weight="400" fill="#2c3138" text-anchor="start">阻隔排水管空氣進入室內。</text><path d="M58 591 H1142" stroke="#e6e8ec"/><text x="58" y="634" font-size="19" font-weight="400" fill="#7a8088" text-anchor="start">原理示意。單憑氣味不能確定故障原因。</text></svg>