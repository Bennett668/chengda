<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1200 675" role="img" aria-labelledby="figure-title figure-desc" xml:lang="en"><title id="figure-title">Tank condensation or an external leak?</title><desc id="figure-desc">Two toilet tanks: scattered water beads on the outside surface versus a local water trail at a joint. These patterns are clues, not a diagnosis.</desc><defs><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2563a8"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#7a8088"/></marker></defs><style>text{font-family:Inter,"PingFang TC",Arial,sans-serif;letter-spacing:0}svg{background:#fff}</style><rect width="1200" height="675" fill="#fff"/><text x="58" y="49" font-size="15" fill="#2563a8" font-weight="500" text-anchor="start">CHENGDA  /  BATHROOM SCIENCE</text><text x="58" y="111" font-size="36" fill="#14171b" font-weight="600" text-anchor="start">Tank condensation or an external leak?</text><text x="58" y="153" font-size="22" fill="#7a8088" font-weight="400" text-anchor="start">Where moisture first appears is a clue.</text><path d="M58 184H1142" stroke="#e6e8ec" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="300" y="235" font-size="27" fill="#14171b" font-weight="600" text-anchor="middle">Across the surface</text><text x="875" y="235" font-size="27" fill="#14171b" font-weight="600" text-anchor="middle">At a joint or connection</text><rect x="160" y="270" width="280" height="198" rx="17" stroke="#14171b" stroke-width="4" fill="#fff" /><path d="M152 270H448" stroke="#14171b" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M208 470V492H391V470" stroke="#7a8088" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"