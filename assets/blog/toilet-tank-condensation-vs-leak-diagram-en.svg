ke="#2563a8" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(361 379) scale(0.9)"><path d="M0 -10 C-3 -5 -7 0 -7 5 A7 7 0 0 0 7 5 C7 0 3 -5 0 -10Z" stroke="#2563a8" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(411 372) scale(0.7)"><path d="M0 -10 C-3 -5 -7 0 -7 5 A7 7 0 0 0 7 5 C7 0 3 -5 0 -10Z" stroke="#2563a8" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(186 427) scale(0.65)"><path d="M0 -10 C-3 -5 -7 0 -7 5 A7 7 0 0 0 7 5 C7 0 3 -5 0 -10Z" stroke="#2563a8" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(252 425) scale(0.9)"><path d="M0 -10 C-3 -5 -7 0 -7 5 A7 7 0 0 0 7 5 C7 0 3 -5 0 -10Z" stroke="#2563a8" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(318 436) scale(0.7)"><path d="M0 -10 C-3 -5 -7 0 -7 5 A7 7 0 0 0 7 5 C7 0 3 -5 0 -10Z" stroke="#2563a8" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(392 429) scale(0.8)"><path d="M0 -10 C-3 -5 -7 0 -7 5 A7 7 0 0 0 7 5 C7 0 3 -5 0 -10Z" stroke="#2563a8" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><circle cx="870" cy="469" r="7" stroke="#14171b" stroke-width="2" fill="#fff" /><path d="M870 476C877 481 864 488 871 497V514" stroke="#2563a8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(871 531) scale(0.8)"><path d="M0 -10 C-3 -5 -7 0 -7 5 A7 7 0 0 0 7 5 C7 0 3 -5 0 -10Z" stroke="#2563a8" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M1030 407H987L887 465" stroke="#7a8088" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><text x="1040" y="397" font-size="21" fill="#7a8088" font-weight="400" text-anchor="start">Local</text><text x="1040" y="425" font-size="21" fill="#7a8088" font-weight="400" text-anchor="start">water trail</text><text x="300" y="565" font-size="22" fill="#7a8088" font-weight="400" text-anchor="middle">Condensation is one possibility</text><text x="875" y="565" font-size="22" fill="#7a8088" font-weight="400" text-anchor="middle">Trace the first wet point</text><path d="M58 590H1142" stroke="#e6e8ec" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="58" y="632" font-size="20" fill="#7a8088" font-weight="400" text-anchor="start">Patterns are clues, not proof. A leak and condensation can occur together.</text></svg>