<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1200 675" role="img" aria-labelledby="figure-title figure-desc" xml:lang="en"><title id="figure-title">Soft-close trouble: three separate checks</title><desc id="figure-desc">An exploded side view separates the lid, seat ring and hinge base. Curved arrows indicate checking lid and seat descent separately; a horizontal arrow marks unwanted base movement. The mechanism is illustrative.</desc><defs><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2563a8"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#7a8088"/></marker></defs><style>text{font-family:Inter,"PingFang TC",Arial,sans-serif;letter-spacing:0}svg{background:#fff}</style><rect width="1200" height="675" fill="#fff"/><text x="58" y="49" font-size="15" fill="#2563a8" font-weight="500" text-anchor="start">CHENGDA  /  BATHROOM SCIENCE</text><text x="58" y="111" font-size="36" fill="#14171b" font-weight="600" text-anchor="start">Soft-close trouble: three separate checks</text><text x="58" y="153" font-size="22" fill="#7a8088" font-weight="400" text-anchor="start">The lid, seat ring and base do different jobs.</text><path d="M58 184H1142" stroke="#e6e8ec" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M449 303L647 209Q658 203 666 213Q673 225 660 232L462 326Z" stroke="#14171b" stroke-width="4" fill="#fff" stroke-linecap="round" stroke-linejoin="round" /><circle cx="451" cy="321" r="12" stroke="#14171b" stroke-width="3" fill="#fff" /><path d="M461 324H713" stroke="#7a8088" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 8"/><path d="M653 247Q688 269 697 312" stroke="#2563a8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoi