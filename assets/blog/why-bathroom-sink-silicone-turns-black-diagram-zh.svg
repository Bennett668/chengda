<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1200 675" role="img" aria-labelledby="figure-title figure-desc" xml:lang="zh-Hant"><title id="figure-title">膠縫發黑，要分開看表面與密封狀態</title><desc id="figure-desc">放大洗手盆與枱面的矽膠接縫。上方放大圖表示完整膠縫表面有水分與沉積，並不辨認微生物。下方另一剖面表示膠縫邊緣脫粘；這是另一種密封缺陷，不能靠顏色確診。</desc><defs><marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#2563a8"/></marker><marker id="arrow-gray" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#7a8088"/></marker></defs><style>text{font-family:Inter,"PingFang TC",Arial,sans-serif;letter-spacing:0}svg{background:#fff}</style><rect width="1200" height="675" fill="#fff"/><text x="58" y="49" font-size="15" fill="#2563a8" font-weight="500" text-anchor="start">CHENGDA  /  衛浴科普</text><text x="58" y="111" font-size="36" fill="#14171b" font-weight="600" text-anchor="start">膠縫發黑，要分開看表面與密封狀態</text><text x="58" y="153" font-size="22" fill="#7a8088" font-weight="400" text-anchor="start">表面積污，與膠縫邊緣脫粘，是兩個不同的觀察。</text><path d="M58 184H1142" stroke="#e6e8ec" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="265" y="244" font-size="26" fill="#14171b" font-weight="600" text-anchor="middle">洗手盆邊的接縫</text><path d="M115 384H490V408H115" stroke="#7a8088" stroke-width="4" fill="#fff" stroke-linejoin="round" stroke-linecap="round" /><path d="M146 333Q266 313 424 333L402 406Q286 469 174 406Z" stroke="#14171b" stroke-width="4" fill="#fff" stroke-linejoin="round" stroke-linecap="round" /><path d="M157 337Q278 379 414 337" stroke="#14171b" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M267 326V280Q267 264 284 264H331V281H286V326" stroke="#14171b" stroke-width="4" fill="#fff" stroke-linejoin="round" stroke-linecap="round" /><path d="M299 282V299" stroke="#7a8088" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M403 382L413 384" stroke="#2563a8" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="408" cy="386" r="21" stroke="#2563a8" stroke-width="2.5" fill="none" /><path d="M430 371L680 282M430 402L680 455" stroke="#e6e8ec" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="265" y="500" font-size="22" fill="#7a8088" font-weight="400" text-anchor="middle">單看顏色，不能確定成因，</text><text x="265" y="531" font-size="22" fill="#7a8088" font-weight="400" text-anchor="middle">也不能判斷膠縫是否仍然密封。</text><circle cx="819" cy="364" r="133" stroke="#e6e8ec" stroke-width="2.5" fill="#fff" /><path d="M702 393H809V470H740" stroke="#14171b" stroke-width="3" fill="#fff" stroke-linejoin="round" stroke-linecap="round" /><path d="M861 264V393H936" stroke="#14171b" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M809 393Q843 387 861 354V393Z" stroke="#7a8088" stroke-width="2.5" fill="#e6e8ec" stroke-linejoin="round" stroke-linecap="round" /><path d="M807 383Q838 378 853 350" stroke="#2563a8" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><circle cx="813" cy="385" r="2.4" stroke="#14171b" stroke-width="1" fill="#14171b" /><circle cx="824" cy="380" r="2" stroke="#14171b" stroke-width="1" fill="#14171b" /><circle cx="836" cy="373" r="2.8" stroke="#14171b" stroke-width="1" fill="#14171b" /><circle cx="844" cy="363" r="2.1" stroke="#14171b" stroke-width="1" fill="#14171b" /><circle cx="851" cy="354" r="2.2" stroke="#14171b" stroke-width="1" fill="#14171b" /><g transform="translate(828 332) scale(0.9)"><path d="M0 -11C-4 -5 -7 0 -7 5A7 7 0 0 0 7 5C7 0 4 -5 0 -11Z" stroke="#2563a8" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round" /></g><path d="M871 342L949 291H1036" stroke="#7a8088" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="966" y="238" font-size="22" fill="#7a8088" font-weight="400" text-anchor="start">水分與</text><text x="966" y="267" font-size="22" fill="#7a8088" font-weight="400" text-anchor="start">表面沉積</text><text x="810" y="432" font-size="19" fill="#7a8088" font-weight="400" text-anchor="middle">完整膠縫</text><path d="M688 554H750M814 529V554H854" stroke="#14171b" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M750 554Q786 551 805 530V545Q783 567 752 565Z" stroke="#7a8088" stroke-width="2" fill="#e6e8ec" stroke-linejoin="round" stroke-linecap="round" /><path d="M803 505L810 535" stroke="#2563a8" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/><text x="879" y="531" font-size="22" fill="#14171b" font-weight="400" text-anchor="start">邊緣脫粘？</text><text x="879" y="561" font-size="22" fill="#14171b" font-weight="400" text-anchor="start">另行檢查密封狀態。</text><path d="M58 598H1142" stroke="#e6e8ec" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="58" y="639" font-size="20" fill="#7a8088" font-weight="400" text-anchor="start">結構示意。清除表面污物，不能恢復已失效的粘結。</text></svg>