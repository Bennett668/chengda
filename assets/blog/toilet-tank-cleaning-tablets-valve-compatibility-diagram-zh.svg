45H917V386" stroke="#7a8088" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="882" y="347" width="33" height="37" rx="5" stroke="#7a8088" stroke-width="2" fill="#fff" /><path d="M1011 478V358H1032V478" stroke="#7a8088" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M997 470H1047" stroke="#14171b" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="937" y="304" width="54" height="67" rx="5" stroke="#2563a8" stroke-width="3" fill="#fff" /><rect x="950" y="322" width="28" height="15" rx="5" stroke="#2563a8" stroke-width="2" fill="#fff" /><path d="M966 372V396H1009V478" stroke="#2563a8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M1009 479V506" stroke="#2563a8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><text x="1031" y="509" font-size="18" fill="#2563a8" font-weight="400" text-anchor="start">往便池</text><text x="220" y="526" font-size="21" fill="#7a8088" font-weight="400" text-anchor="middle">接觸水箱水體及內部零件</text><text x="601" y="526" font-size="21" fill="#7a8088" font-weight="400" text-anchor="middle">接觸便池表面</text><text x="979" y="553" font-size="20" fill="#7a8088" font-weight="400" text-anchor="middle">經指定的獨立投放路徑</text><path d="M58 590H1142" stroke="#e6e8ec" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="58" y="632" font-size="20" fill="#7a8088" font-weight="400" text-anchor="start">依座廁及清潔產品的指定說明使用；專用系統不代表任何水箱都可直接投放。</text></svg>