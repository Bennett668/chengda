<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1200 675" role="img" aria-labelledby="figure-title figure-desc" xml:lang="zh-Hant"><title id="figure-title">清潔劑相容性：先看接觸路徑</title><desc id="figure-desc">三種接觸路徑：清潔片直接放進水箱並與內部閥件共用水體、清潔劑用於便池，以及廠家設計的獨立投放容器通往便池。是否相容須按指定產品及系統判斷。</desc><defs><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2563a8"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#7a8088"/></marker></defs><style>text{font-family:Inter,"PingFang TC",Arial,sans-serif;letter-spacing:0}svg{background:#fff}</style><rect width="1200" height="675" fill="#fff"/><text x="58" y="49" font-size="15" fill="#2563a8" font-weight="500" text-anchor="start">CHENGDA  /  衛浴科普</text><text x="58" y="111" font-size="36" fill="#14171b" font-weight="600" text-anchor="start">清潔劑相容性：先看接觸路徑</text><text x="58" y="153" font-size="22" fill="#7a8088" font-weight="400" text-anchor="start">三種不同用途，不能互相替代。</text><path d="M58 184H1142" stroke="#e6e8ec" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="220" y="237" font-size="25" fill="#14171b" font-weight="600" text-anchor="middle">直接放進水箱</text><text x="601" y="237" font-size="25" fill="#14171b" font-weight="600" text-anchor="middle">清潔便池</text><text x="979" y="237" font-size="25" fill="#14171b" font-weight="600" text-anchor="middle">專用投放系統</text><rect x="97" y="285" width="249" height="195" rx="8" stroke="#14171b" stroke-width="3.5" fill="#fff" /><path d="M91 285H352" stroke="#14171b" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M102 360H341" stroke="#2563a8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M138 471V345H160V386" stroke="#7a8088" stroke-width="4" fill="none" stroke-linec