<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'self'; object-src 'none'">
<title>本機統計設定 | Chengda Analytics Preferences</title>
<link rel="icon" href="/favicon.ico">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #fff; color: #202424; font: 16px/1.6 system-ui, sans-serif; letter-spacing: 0; }
main { max-width: 640px; margin: 64px auto; padding: 0 24px; }
h1 { font-size: 26px; line-height: 1.3; margin: 32px 0 24px; }
label { display: flex; align-items: flex-start; gap: 12px; padding: 24px 0; border-block: 1px solid #dce1df; cursor: pointer; }
input { width: 20px; height: 20px; margin: 4px 0 0; flex: 0 0 20px; accent-color: #16715c; }
small { display: block; color: #5a6560; font-size: 14px; }
#status { min-height: 52px; color: #16715c; }
a { color: #166a82; }
</style>
</head>
<body>
<main>
<a href="/zh/">CHENGDA 程達</a>
<h1>本機統計設定 <small lang="en">Browser Analytics Preferences</small></h1>
<label for="exclude-analytics">
<input type="checkbox" id="exclude-analytics" disabled>
<span>排除此瀏覽器的網站統計<small lang="en">Exclude this browser from website analytics</small></span>
</label>
<p id="status" role="status" aria-live="polite">正在讀取設定 / Loading preference</p>
<noscript>JavaScript 未啟用，無法變更設定。<span lang="en"> JavaScript is required to change this preference.</span></noscript>
<a href="/products/">產品圖冊 / Product Catalogue</a>
</main>
<script src="/assets/analytics-preferences.js"></script>
</body>
</html>
